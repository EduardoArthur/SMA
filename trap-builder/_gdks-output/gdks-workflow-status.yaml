# GD-KS Workflow Status

# Project Information
project:
  name: "Trap Builder"
  codename: "toon-defense"
  description: "Tower Defense sem torres, apenas armadilhas cartoon (estilo Acme) de uso único. Ciclo Blueprint (planejamento em grid) → Ação (execução sem interação), com rotas bifurcadas e orçamento fixo por fase."
  game_type: "Tower Defense / Puzzle de Estratégia"
  platforms: ["PC", "Mobile"]
  engine: "godot-4"
  source_document: "_gdks-output/00-input/GDD-Toon-Defense.pdf"
  created_at: "2026-11-07"
  updated_at: "2026-11-07"

# Selected Track
