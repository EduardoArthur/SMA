# Notes
notes:
  - "GDD inicial já define loop, inimigos (porcos, patos, armaduras, veículos), 13 armadilhas e economia por estrelas."
  - "Prazo curto + iniciante em Godot: o protótipo deve ter um subconjunto de armadilhas (ex.: bigorna, TNT, banana, isca) e poucas fases."
  - "Questões em aberto do GDD: regra de RNG nas bifurcações, comportamento dos patos (voadores) com armadilhas de chão, diferenças de UX entre PC e Mobile."
  - "Fantasia central definida: o jogador é o Lobo Mau (porcos e patos dos contos como inimigos)."
  - "Premissa definida: Lobo Emboscador. Os porcos atravessam a floresta e o lobo os embosca; os inimigos vencem ao chegar à saída do mapa."
