<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Lawn tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#A6DB78" stroke="#6B3A12" stroke-width="6"/>
  <!-- Coiled body: outline pass, fill pass, belly highlight (same technique as the game) -->
  <path d="M26 100 C26 80 50 78 64 84 C80 91 100 88 100 70 C100 54 82 50 66 52 C52 54 40 48 44 36"
        fill="none" stroke="#6B3A12" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 100 C26 80 50 78 64 84 C80 91 100 88 100 70 C100 54 82 50 66 52 C52 54 40 48 44 36"
        fill="none" stroke="#FFB830" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 96 C30 82 50 79 63 84 C79 90 97 86 97 70 C97 57 82 53 67 55"
        fill="none" stroke="#FFD976" stroke-width="5" stroke-linecap="round"/>
  <!-- Forked tongue -->
  <path d="M54 22 L64 14 M64 14 L70 15 M64 14 L66 8" fill="none" stroke="#FF5C7A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head (bigger than the body), facing up-right -->
  <circle cx="46" cy="32" r="17" fill="#FFB830" stroke="#6B3A12" stroke-width="5"/>
  <!-- Eyes side by side across the heading, like in the game -->
  <circle cx="40" cy="26" r="6.5" fill="#FFFFFF" stroke="#6B3A12" stroke-width="2.5"/>
  <circle cx="54" cy="31" r="6.5" fill="#FFFFFF" stroke="#6B3A12" stroke-width="2.5"/>
  <circle cx="42" cy="24.5" r="3.2" fill="#2B1D14"/>
  <circle cx="56" cy="29.5" r="3.2" fill="#2B1D14"/>
  <!-- Cheek -->
  <circle cx="36" cy="38" r="3.5" fill="#FF8FA3" opacity="0.7"/>
  <!-- Apple it is about to eat -->
  <circle cx="98" cy="30" r="12" fill="#E8394B" stroke="#6B3A12" stroke-width="4"/>
  <path d="M98 18 L100 11" stroke="#6B3A12" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 14 Q107 9 110 14 Q104 17 100 14 Z" fill="#5DBB4A" stroke="#6B3A12" stroke-width="1.5"/>
  <circle cx="94" cy="26" r="3" fill="#FFFFFF" opacity="0.7"/>
</svg>
